<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>相机特效预览</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main id="stage">
  <video id="camera" playsinline muted hidden></video>
  <canvas id="effects" aria-hidden="true"></canvas>
  <aside id="expression-debug" aria-label="表情调试" hidden>
    <strong>Expression Debug</strong>
    <div class="debug-row"><label for="smile-meter">Smile Score</label><output id="smile-score">—</output></div>
    <meter id="smile-meter" min="0" max="1" value="0"></meter>
    <div class="debug-row"><label for="jaw-meter">Jaw Open</label><output id="jaw-score">—</output></div>
    <meter id="jaw-meter" min="0" max="1" value="0"></meter>
    <div class="debug-row"><span>原始左笑 / 右笑 / 张嘴</span><output id="expression-raw">—</output></div>
    <div class="debug-row"><span>开口 / 大笑笑意 / 疑似说话</span><output id="expression-gates">—</output></div>
    <div class="debug-row"><span>嘴唇开合比</span><output id="lip-opening">—</output></div>
    <div class="debug-row"><span>当前状态</span><output id="expression-state">等待相机</output></div>
    <div class="debug-row"><span>状态持续</span><output id="expression-duration">—</output></div>
    <div class="debug-row"><span>候选状态</span><output id="expression-candidate">—</output></div>
    <div class="debug-row"><span>切换冷却</span><output id="expression-cooldown">—</output></div>
  </aside>
  <output id="performance-debug" hidden>FPS — · 粒子 0 / 3600</output>
  <div class="camera-controls">
    <button id="toggle" type="button" disabled>开启相机</button>
    <p id="hint" role="status"></p>
  </div>
</main>
</body>
</html>
